<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Calculations</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/datepicker.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://unpkg.com/gijgo@1.9.14/js/gijgo.min.js" type="text/javascript"></script>
    <link href="https://unpkg.com/gijgo@1.9.14/css/gijgo.min.css" rel="stylesheet" type="text/css" />
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const adultsRateInput = document.getElementById('adults_rate');
            const adultsCommissionInput = document.getElementById('adults_commission');
            const adultsAgentAmountInput = document.getElementById('adults_agent_amount');
            const childRateInput = document.getElementById('child_rate');
            const childCommissionInput = document.getElementById('child_commission');
            const childAgentAmountInput = document.getElementById('child_agent_amount');
            const infantRateInput = document.getElementById('infant_rate');
            const infantCommissionInput = document.getElementById('infant_commission');
            const infantAgentAmountInput = document.getElementById('infant_agent_amount');

            function calculateAgentAmount(rateInput, commissionInput, agentAmountInput) {
                const rate = parseFloat(rateInput.value) || 0;
                const commissionPercentage = parseFloat(commissionInput.value) || 0;

                if (rate && commissionPercentage) {
                    const commissionAmount = Math.floor((commissionPercentage / 100) * rate);
                    const agentAmount = rate - commissionAmount;
                    agentAmountInput.value = agentAmount;
                } else {
                    agentAmountInput.value = '';
                }
            }

            adultsRateInput.addEventListener('input', function() {
                calculateAgentAmount(adultsRateInput, adultsCommissionInput, adultsAgentAmountInput);
            });

            adultsCommissionInput.addEventListener('input', function() {
                calculateAgentAmount(adultsRateInput, adultsCommissionInput, adultsAgentAmountInput);
            });

            childRateInput.addEventListener('input', function() {
                calculateAgentAmount(childRateInput, childCommissionInput, childAgentAmountInput);
            });

            childCommissionInput.addEventListener('input', function() {
                calculateAgentAmount(childRateInput, childCommissionInput, childAgentAmountInput);
            });

            infantRateInput.addEventListener('input', function() {
                calculateAgentAmount(infantRateInput, infantCommissionInput, infantAgentAmountInput);
            });

            infantCommissionInput.addEventListener('input', function() {
                calculateAgentAmount(infantRateInput, infantCommissionInput, infantAgentAmountInput);
            });

         const startDateInput = document.getElementById('start_date');
         const endDateInput = document.getElementById('end_date');
        });
    </script>


</head>
<body>
    <div class="mx-10 pt-5 gap-5 flex w-full">
        <div class="pr-5 relative w-full flex-grow">
            <form action="#" id="pricingAndDepature" class="gap-10 flex flex-col pb-10 inputLabelPackage">
               <div class="gap-5 grid grid-flow-row-dense grid-cols-5 items-center">
                  <label for="pricing_group" class="flex justify-start col-span-1">Select Date<span class="text-red pl-1">*</span></label>
                  <div class="col-span-2">
                     <div class="relative w-50">
                        <input id="start_date" datepicker type="text"
                           class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                           placeholder="Start date">
                     </div>
                     <!-- <input id="start_date_datepicker" width="276" /> -->
                  </div>
                  <div class="col-span-2">
                     <div class="relative w-50">
                        <input id="end_date" datepicker type="text"
                           class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
                           placeholder="End date">
                     </div>
                     <!-- <input id="end_date_datepicker" width="276" /> -->
                  </div>
              </div>
               
               <div class="gap-5 grid grid-flow-row-dense grid-cols-5 items-center pt-5">
                  <label for="pricing_group" class="flex justify-start col-span-1">Pricing<span class="text-red pl-1">*</span></label>
                  <div class="col-span-2">
                     <select disabled>
                        <option value="per_person" selected>Per person</option>
                     </select>
                  </div>
                  <div class="col-span-2">
                     <select disabled>
                        <option value="per_person" selected>INR</option>
                     </select>
                  </div>
                </div>

                <div class="flex flex-col gap-5 pb-5 pt-5 mt-5">
                    <!-- Header Row -->
                    <div class="grid grid-flow-row-dense grid-cols-5">
                        <div class="col-span-1 flex "></div>
                        <div class="col-span-1 flex justify-center">Rate</div>
                        <div class="col-span-1 flex justify-center">Admin commission</div>
                        <div class="col-span-1 flex justify-center">=</div>
                        <div class="col-span-1 flex justify-center">Agent amount</div>
                    </div>

                    <!-- Adults Row -->
                    <div class="gap-5 grid grid-flow-row-dense grid-cols-5 items-center">
                        <div class="flex justify-start items-center h-[58px] col-span-1">Adults (Age 12-99)<span class="text-red pl-1">*</span>:</div>
                        <div class="col-span-1">
                            <input id="adults_rate" name="adults_rate" placeholder="Actual rate" type="number" class="inputFieldPackage py-4 rounded-lg pl-3 w-full" value="">
                        </div>
                        <div class="col-span-1 relative">
                            <input id="adults_commission" name="adults_commission" max="100" min="0" placeholder="20" type="number" class="inputFieldPackage py-4 rounded-lg pl-3 w-full" value="">
                            <div class="absolute right-3 top-3">
                                <svg class="MuiSvgIcon-root MuiSvgIcon-fontSizeMedium css-h03rim" focusable="false" aria-hidden="true" viewBox="0 0 24 24" data-testid="PercentIcon">
                                    <path d="M7.5 11C9.43 11 11 9.43 11 7.5S9.43 4 7.5 4 4 5.57 4 7.5 5.57 11 7.5 11m0-5C8.33 6 9 6.67 9 7.5S8.33 9 7.5 9 6 8.33 6 7.5 6.67 6 7.5 6M4.0025 18.5832 18.59 3.9955l1.4142 1.4143L5.4167 19.9974zM16.5 13c-1.93 0-3.5 1.57-3.5 3.5s1.57 3.5 3.5 3.5 3.5-1.57 3.5-3.5-1.57-3.5-3.5-3.5m0 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="flex justify-center items-center h-[58px] col-span-1">=</div>
                        <div class="col-span-1">
                            <input id="adults_agent_amount" name="adults_agent_amount" disabled placeholder="" type="number" class="inputFieldPackage py-4 rounded-lg pl-3 w-full cursor-not-allowed" value="">
                        </div>
                    </div>

                    <!-- Child Row -->
                    <div class="gap-5 grid grid-flow-row-dense grid-cols-5 items-center">
                        <div class="flex justify-start items-center h-[58px] col-span-1">Child (Age 3-11)<span class="text-red pl-1">*</span>:</div>
                        <div class="col-span-1">
                            <input id="child_rate" name="child_rate" placeholder="Actual rate" type="number" class="inputFieldPackage py-4 rounded-lg pl-3 w-full" value="">
                        </div>
                        <div class="col-span-1 relative">
                            <input id="child_commission" name="child_commission" max="100" min="0" placeholder="20" type="number" class="inputFieldPackage py-4 rounded-lg pl-3 w-full" value="">
                            <div class="absolute right-3 top-3">
                                <svg class="MuiSvgIcon-root MuiSvgIcon-fontSizeMedium css-h03rim" focusable="false" aria-hidden="true" viewBox="0 0 24 24" data-testid="PercentIcon">
                                    <path d="M7.5 11C9.43 11 11 9.43 11 7.5S9.43 4 7.5 4 4 5.57 4 7.5 5.57 11 7.5 11m0-5C8.33 6 9 6.67 9 7.5S8.33 9 7.5 9 6 8.33 6 7.5 6.67 6 7.5 6M4.0025 18.5832 18.59 3.9955l1.4142 1.4143L5.4167 19.9974zM16.5 13c-1.93 0-3.5 1.57-3.5 3.5s1.57 3.5 3.5 3.5 3.5-1.57 3.5-3.5-1.57-3.5-3.5-3.5m0 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="flex justify-center items-center h-[58px] col-span-1">=</div>
                        <div class="col-span-1">
                            <input id="child_agent_amount" name="child_agent_amount" disabled placeholder="" type="number" class="inputFieldPackage py-4 rounded-lg pl-3 w-full cursor-not-allowed" value="">
                        </div>
                    </div>

                    <!-- Infant Row -->
                    <div class="gap-5 grid grid-flow-row-dense grid-cols-5 items-center">
                        <div class="flex justify-start items-center h-[58px] col-span-1">Infant (Age 0-2)<span class="text-red pl-1">*</span>:</div>
                        <div class="col-span-1">
                            <input id="infant_rate" name="infant_rate" placeholder="Actual rate" type="number" class="inputFieldPackage py-4 rounded-lg pl-3 w-full" value="">
                        </div>
                        <div class="col-span-1 relative">
                            <input id="infant_commission" name="infant_commission" max="100" min="0" placeholder="20" type="number" class="inputFieldPackage py-4 rounded-lg pl-3 w-full" value="">
                            <div class="absolute right-3 top-3">
                                <svg class="MuiSvgIcon-root MuiSvgIcon-fontSizeMedium css-h03rim" focusable="false" aria-hidden="true" viewBox="0 0 24 24" data-testid="PercentIcon">
                                    <path d="M7.5 11C9.43 11 11 9.43 11 7.5S9.43 4 7.5 4 4 5.57 4 7.5 5.57 11 7.5 11m0-5C8.33 6 9 6.67 9 7.5S8.33 9 7.5 9 6 8.33 6 7.5 6.67 6 7.5 6M4.0025 18.5832 18.59 3.9955l1.4142 1.4143L5.4167 19.9974zM16.5 13c-1.93 0-3.5 1.57-3.5 3.5s1.57 3.5 3.5 3.5 3.5-1.57 3.5-3.5-1.57-3.5-3.5-3.5m0 5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="flex justify-center items-center h-[58px] col-span-1">=</div>
                        <div class="col-span-1">
                            <input id="infant_agent_amount" name="infant_agent_amount" disabled placeholder="" type="number" class="inputFieldPackage py-4 rounded-lg pl-3 w-full cursor-not-allowed" value="">
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
